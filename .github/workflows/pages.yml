name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - run: python build.py
        env:
          # Set under Settings > Secrets and variables > Actions > Variables.
          # Without them the site is built from the JSON files in data/.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # The live address for canonical links and the sitemap (default https://atleanworld.com),
          # and SITE_INDEXING = on to let Google index the site. Leave it unset until go-live,
          # so the preview is never indexed.
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_INDEXING: ${{ vars.SITE_INDEXING }}
          # The folder the site is served from ("/aw-website" on the Pages preview, empty
          # on a custom domain), so the 404 page's links work at any address.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
